[package]
name = "ass"
version = "0.1.0"
edition = "2021"
authors = ["SS Project"]
description = "ASS - App Service Server: proxy inverso, TLS automático, gestión de procesos y más en un único binario"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "ass"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP server/client
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.5"

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
x509-parser = "0.16"

# ACME / Let's Encrypt
instant-acme = "0.6"

# Serialization / Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "color"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Async utilities
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["full"] }

# Cryptography (firma para self-updater)
ring = "0.17"
base64 = "0.22"

# Proceso hijo / supervisión
nix = { version = "0.28", features = ["process", "signal"] }

# DNS lookup
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

# Rate limiting
governor = "0.6"

# Wildcard / glob matching
glob = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# System info
sysinfo = "0.30"

# Channels / notification
tokio-stream = "0.1"

# HTTP client (para ACME challenge y self-updater)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Datetime
chrono = { version = "0.4", features = ["serde"] }

# Temp dirs (self-update)
tempfile = "3.10"

# File watching
notify = "6.1"

# WebSocket para túneles
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Generación de CSR para ACME
rcgen = "0.13"

# Lazy statics async-safe
once_cell = "1.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
